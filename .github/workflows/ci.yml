name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Labs: the starters are meant to fail, so CI checks each lab's tests against its reference solution.
      - name: Labs
        run: |
          for lab in labs/*/; do
            echo "::group::$lab"
            (cd "$lab" && npm ci && npm run typecheck && npm run check:solution)
            echo "::endgroup::"
          done
