name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run validate
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      # Labs: the starter is meant to fail, so CI checks the tests against the reference solution.
      - run: npm ci
        working-directory: labs/d1-agent-loop
      - run: npm run typecheck
        working-directory: labs/d1-agent-loop
      - run: npm run check:solution
        working-directory: labs/d1-agent-loop
