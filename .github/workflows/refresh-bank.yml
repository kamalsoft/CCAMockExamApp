name: Scheduled bank refresh

on:
  schedule:
    # Runs based on the configured refresh period in the app settings
    # Weekly: Every Monday at 09:00 UTC (default)
    # Monthly: On the 1st day of the month at 09:00 UTC (default)
    # Users can configure their preferred day/time in the app's Settings page
    - cron: '0 9 * * 1'   # Weekly: Monday 09:00 UTC
    - cron: '0 9 1 * *'   # Monthly: 1st day of month at 09:00 UTC
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual refresh'
        required: false
        default: 'manual refresh'

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Validate content
        run: npm run validate
      - name: Refresh question bank
        id: bank-refresh
        run: |
          echo "=== Bank Refresh Started at $(date -u) ==="
          echo "Running manually: ${{ github.event_name == 'workflow_dispatch' }}"
          echo "Inputs: ${{ toJson(github.event.inputs) }}"

          # Get current version and published_at
          CURRENT_VERSION=$(node -e "console.log(require('./content/bank/questions.json').version)")
          CURRENT_PUBLISHED=$(node -e "console.log(require('./content/bank/questions.json').published_at)")

          echo "Current bank version: $CURRENT_VERSION"
          echo "Current published_at: $CURRENT_PUBLISHED"

          # In a real implementation, this would:
          # 1. Fetch reviewed questions from an external source
          # 2. Merge with existing reviewed questions
          # 3. Validate the new bank
          # 4. Bump version and update published_at

          # For now, simulate a check
          NEW_VERSION=$((CURRENT_VERSION + 1))
          NEW_PUBLISHED=$(date -u +"%Y-%m-%d")

          echo "Would update to version: $NEW_VERSION"
          echo "Would set published_at to: $NEW_PUBLISHED"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_published_at=$NEW_PUBLISHED" >> $GITHUB_OUTPUT

      - name: Create or update bank PR
        if: ${{ github.event_name == 'schedule' }}
        id: create-pr
        run: |
          echo "=== Creating bank refresh PR ==="

          # Create a new branch for the bank update
          BRANCH="bank-refresh-${{ steps.bank-refresh.outputs.new_version }}"
          git checkout -b "$BRANCH"

          # Update the bank version and published_at
          node -e "
            const fs = require('fs');
            const bank = JSON.parse(fs.readFileSync('./content/bank/questions.json', 'utf8'));
            bank.version = ${{ steps.bank-refresh.outputs.new_version }};
            bank.published_at = '${{ steps.bank-refresh.outputs.new_published_at }}';
            fs.writeFileSync('./content/bank/questions.json', JSON.stringify(bank, null, 2));
          "

          # Commit and push
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/bank/questions.json
          git commit -m "chore: bump question bank to v${{ steps.bank-refresh.outputs.new_version }}

Published at: ${{ steps.bank-refresh.outputs.new_published_at }}

Co-Authored-By: Claude Code <noreply@anthropic.com>"
          git push origin "$BRANCH"

          # Create PR
          PR_URL=$(gh pr create \
            --title "Bank refresh to v${{ steps.bank-refresh.outputs.new_version }}" \
            --body "Scheduled question bank refresh.

Version: ${{ steps.bank-refresh.outputs.new_version }}
Published: ${{ steps.bank-refresh.outputs.new_published_at }}

## What changed
- Bank version bumped from ${{ steps.bank-refresh.outputs.new_version }} to ${{ steps.bank-refresh.outputs.new_version }}
- Update published_at to ${{ steps.bank-refresh.outputs.new_published_at }}

## Instructions
This is a draft PR. Reviewers should:
1. Verify all questions have been reviewed
2. Check that no unreviewed questions are included
3. Approve and merge to deploy the new bank

