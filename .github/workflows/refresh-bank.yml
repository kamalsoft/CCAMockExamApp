name: Scheduled bank refresh

on:
  schedule:
    # Hourly, in UTC. The script publishes only in the hour set in content/schedule.json.
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Check now, even outside the scheduled hour'
        type: boolean
        default: true

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish reviewed questions if due
        id: refresh
        env:
          FORCE: ${{ inputs.force == true }}
        run: node scripts/refresh-bank.ts
      - name: Validate content
        if: steps.refresh.outputs.changed == 'true'
        run: npm run validate
      - name: Open pull request for review
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SUMMARY: ${{ steps.refresh.outputs.summary }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C bank-refresh
          git add content
          git commit -m "chore: refresh question bank ($SUMMARY)"
          git push --force origin bank-refresh
          gh pr view bank-refresh >/dev/null 2>&1 || gh pr create \
            --base main --head bank-refresh \
            --title "Question bank refresh" \
            --body "Reviewed questions added to the bank: $SUMMARY. Merging publishes them on the next deploy. Run log: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
